services:
  # ============================================
  # PHP Web Server
  # ============================================
  web:
    image: php:8.2-apache
    container_name: kvn_web
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini
      - ./docker/apache/vhost.conf:/etc/apache2/sites-available/000-default.conf
    environment:
      - APP_ENV=development
      - APP_DEBUG=true
    depends_on:
      - db
      - mailhog
    networks:
      - kvn_network
    command: >
      bash -c "docker-php-ext-install pdo pdo_mysql &&
               a2enmod rewrite &&
               apache2-foreground"

  # ============================================
  # MySQL Database
  # ============================================
  db:
    image: mysql:8.0
    container_name: kvn_db
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: kvnc_platform
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: kvn_user
      MYSQL_PASSWORD: kvn_pass
    volumes:
      - db_data:/var/lib/mysql
      # The schema lives in migration/, not database/schema.  Mount files in
      # dependency order so a fresh database has tables before indexes.
      - ./database/migration/Kvnc_platform.sql:/docker-entrypoint-initdb.d/001_kvnc_platform.sql:ro
      - ./database/migration/index_migration.sql:/docker-entrypoint-initdb.d/002_index_migration.sql:ro
      - ./database/migration/consolidate_duplicate_tables.sql:/docker-entrypoint-initdb.d/003_consolidate_duplicate_tables.sql:ro
    networks:
      - kvn_network

  # ============================================
  # phpMyAdmin (Dev Only)
  # ============================================
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: kvn_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: secret
    depends_on:
      - db
    networks:
      - kvn_network

  # ============================================
  # MailHog (Email Testing)
  # ============================================
  mailhog:
    image: mailhog/mailhog:latest
    container_name: kvn_mailhog
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - kvn_network

volumes:
  db_data:

networks:
  kvn_network:
    driver: bridge
